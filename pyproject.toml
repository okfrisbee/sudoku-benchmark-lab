[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "sudoku-benchmark-lab"
version = "0.1.0"
description = "Sudoku solver experiments and benchmarks"
requires-python = ">=3.11"
dependencies = [
  "pandas>=2.3,<3",
  "matplotlib>=3.10,<4",
  "python-sat>=1.8.dev30,<2",
  "z3-solver>=4.16,<5",
]

[project.optional-dependencies]
dev = ["pytest>=9,<10"]

[project.scripts]
sudoku-lab = "sudoku_benchmark_lab.cli:main"
sudoku-research = "sudoku_benchmark_lab.benchmark.suite:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
